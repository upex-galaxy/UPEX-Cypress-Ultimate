name: 🔒 Alwaysdata Keep-Alive

on:
  schedule:
  - cron: "0 0 1 * *" # Ejecuta el workflow el día 1 de cada mes a medianoche UTC
  workflow_dispatch:
    # Permite ejecución manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    environment:
      name: QA
    env:
      ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
      ALWAYSDATA_PASS: ${{ secrets.ALWAYSDATA_PASS }}

    steps:
    - name: 📦 Checkout Repository
      uses: actions/checkout@v4

    - name: 💿 Install Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Check Necesary Secrets
      run: |
        if [ -z "$ALWAYSDATA_USER" ] || [ -z "$ALWAYSDATA_PASS" ]; then
          echo "Error: ALWAYSDATA_USER or ALWAYSDATA_PASS is not defined"
          exit 1
        fi

    - name: 🍙 Bun Setup
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Verify Cypress Installation
      run: |
        if ! npx cypress --version; then
          echo "Error: Cypress is not installed."
          exit 1
        fi

    - name: Run Alwaysdata Cron Job
      uses: cypress-io/github-action@v4
      with:
        browser: chrome
        command: |
          bun run cypress run --config-file=cypress.config.cron.ts --spec=cypress/Tests/utils/AlwaysData-cron.cy.ts
